<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus AI Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased h-screen overflow-hidden">

  <div id="app" class="h-full w-full flex"></div>

  <script>
    const DB = {
      getApiKey: () => localStorage.getItem('gemini_api_key') || '',
      setApiKey: (k) => localStorage.setItem('gemini_api_key', k),
      getChats: () => JSON.parse(localStorage.getItem('nexus_chats') || '[]'),
      setChats: (c) => localStorage.setItem('nexus_chats', JSON.stringify(c))
    };

    if (DB.getChats().length === 0) {
      DB.setChats([{
        id: '1',
        title: 'New Chat',
        messages: [{ sender: 'ai', text: 'Hello! I am your AI assistant. How can I help you today?' }],
        updatedAt: Date.now()
      }]);
    }

    let state = {
      chats: DB.getChats(),
      activeChatId: DB.getChats()[0]?.id || '1',
      apiKey: DB.getApiKey(),
      isSettingsOpen: false,
      inputText: ''
    };

    function render() {
      const app = document.getElementById('app');
      const activeChat = state.chats.find(c => c.id === state.activeChatId) || state.chats[0];

      app.innerHTML = `
        <div class="flex h-screen w-full bg-zinc-950 text-zinc-100">
          <!-- SIDEBAR -->
          <aside class="w-64 border-r border-zinc-800 bg-zinc-900/80 flex flex-col justify-between p-3 shrink-0">
            <div class="space-y-3">
              <div class="flex items-center gap-2 px-3 py-2 text-purple-500 font-bold text-lg tracking-wider">
                <i data-lucide="bot" class="w-6 h-6"></i> NEXUS AI
              </div>
              <button onclick="createNewChatSession()" class="w-full py-2.5 px-3 rounded-xl border border-zinc-700 hover:bg-zinc-800 text-xs font-semibold flex items-center gap-2 transition">
                <i data-lucide="plus" class="w-4 h-4"></i> New Chat
              </button>
              <div class="space-y-1 overflow-y-auto max-h-[calc(100vh-180px)]">
                ${state.chats.map(c => `
                  <div onclick="state.activeChatId = '${c.id}'; render();" class="p-2.5 rounded-xl cursor-pointer text-xs truncate transition ${state.activeChatId === c.id ? 'bg-zinc-800 text-white font-medium' : 'text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200'}">
                    ${c.title}
                  </div>
                `).join('')}
              </div>
            </div>

            <button onclick="state.isSettingsOpen = true; render();" class="flex items-center gap-2.5 p-2.5 rounded-xl text-xs font-medium text-zinc-400 hover:bg-zinc-800 hover:text-white transition">
              <i data-lucide="settings" class="w-4 h-4"></i> Settings
            </button>
          </aside>

          <!-- CHAT VIEWPORT -->
          <main class="flex-1 flex flex-col justify-between p-6 overflow-hidden">
            <div id="chatContainer" class="flex-1 overflow-y-auto space-y-4 max-w-3xl mx-auto w-full pr-2">
              ${activeChat.messages.map(m => `
                <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
                  <div class="p-4 rounded-2xl max-w-xl text-sm leading-relaxed ${m.sender === 'user' ? 'bg-purple-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-zinc-200'}">
                    <p class="whitespace-pre-wrap">${m.text || '<span class="animate-pulse text-zinc-500">Thinking...</span>'}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="max-w-3xl mx-auto w-full pt-4">
              <div class="flex items-center gap-2 p-2 rounded-2xl border border-zinc-800 bg-zinc-900 focus-within:border-purple-500 transition shadow-lg">
                <input 
                  id="chatInput"
                  type="text" 
                  value="${state.inputText}"
                  oninput="state.inputText = this.value;"
                  onkeydown="if(event.key === 'Enter') sendChatMessage();"
                  placeholder="Ask anything..."
                  class="flex-1 bg-transparent border-none focus:outline-none text-sm text-white px-3 py-1"
                />
                <button onclick="sendChatMessage()" class="p-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl transition">
                  <i data-lucide="send" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </main>
        </div>

        ${state.isSettingsOpen ? renderSettingsModal() : ''}
      `;

      lucide.createIcons();
      const chatContainer = document.getElementById('chatContainer');
      if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendChatMessage() {
      const inputEl = document.getElementById('chatInput');
      const messageText = inputEl ? inputEl.value.trim() : state.inputText.trim();
      if (!messageText) return;

      const activeChat = state.chats.find(c => c.id === state.activeChatId);
      
      if (activeChat.messages.length === 1 && activeChat.title === 'New Chat') {
        activeChat.title = messageText.slice(0, 24) + '...';
      }

      activeChat.messages.push({ sender: 'user', text: messageText });
      if (inputEl) inputEl.value = '';
      state.inputText = '';
      
      const aiMessageIndex = activeChat.messages.length;
      activeChat.messages.push({ sender: 'ai', text: '' });
      render();

      try {
        const formattedHistory = activeChat.messages.slice(0, -1).map(m => ({
          role: m.sender === 'user' ? 'user' : 'model',
          parts: [{ text: m.text }]
        }));

        const response = await fetch("http://localhost:8000/api/chat/stream", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": state.apiKey
          },
          body: JSON.stringify({
            contents: formattedHistory,
            model: "gemini-2.5-flash"
          })
        });

        if (!response.ok) {
          const err = await response.json();
          activeChat.messages[aiMessageIndex].text = `Error: ${err.detail || 'Failed to generate response'}`;
          render();
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const dataStr = line.replace("data: ", "").trim();
              if (dataStr === "[DONE]") break;

              try {
                const parsed = JSON.parse(dataStr);
                activeChat.messages[aiMessageIndex].text += parsed.text;
                render();
              } catch (e) {
                console.error("Stream parse error:", e);
              }
            }
          }
        }
        DB.setChats(state.chats);
      } catch (err) {
        activeChat.messages[aiMessageIndex].text = "Connection error. Make sure app.py is running on port 8000.";
        render();
      }
    }

    function createNewChatSession() {
      const newChat = { id: Date.now().toString(), title: 'New Chat', messages: [], updatedAt: Date.now() };
      state.chats.unshift(newChat);
      state.activeChatId = newChat.id;
      DB.setChats(state.chats);
      render();
    }

    function renderSettingsModal() {
      return `
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div class="p-6 rounded-2xl max-w-md w-full border bg-zinc-900 border-zinc-800 text-white space-y-4">
            <h2 class="text-lg font-bold">Settings</h2>
            <div>
              <label class="text-xs font-semibold text-zinc-400">Google Gemini API Key</label>
              <input 
                type="password" 
                value="${state.apiKey}"
                onchange="state.apiKey = this.value; DB.setApiKey(this.value);"
                placeholder="Paste API key here"
                class="w-full p-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-xs text-white mt-1.5 focus:outline-none focus:border-purple-500"
              />
            </div>
            <button onclick="state.isSettingsOpen = false; render();" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold text-xs transition">Save & Close</button>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
