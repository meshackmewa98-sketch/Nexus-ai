    const TEMPLATES = [

      { id: 't2', name: 'Instagram Tech Promo', category: 'Social Media', type: 'social', tags: ['social', 'instagram', 'post'] },

    // --- AI ENGINE (GEMINI INTEGRATION) ---
    async function queryAI(prompt) {
      if (!state.apiKey) {
        return "Please open Settings ⚙️ and paste your free Google Gemini API key to enable real AI generation.";
      }
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Unable to retrieve AI response.";
      } catch (e) {
        return "Error connecting to AI service. Check your API key.";
      }
    }

    // --- SPREADSHEET FORMULA EVALUATOR ---
    function evaluateCell(cellValue, grid) {
      if (!cellValue || !cellValue.toString().startsWith('=')) return cellValue;
      const formula = cellValue.substring(1).toUpperCase();
      try {
        if (formula.startsWith('SUM(')) {
          const range = formula.replace('SUM(', '').replace(')', '').split(':');
          if (range.length === 2) {
            let sum = 0;
            // Basic range parse e.g. A2:B2
            const startCol = range[0].charCodeAt(0) - 65;
            const startRow = parseInt(range[0].substring(1)) - 1;
            const endCol = range[1].charCodeAt(0) - 65;
            const endRow = parseInt(range[1].substring(1)) - 1;

            for (let r = startRow; r <= endRow; r++) {
              for (let c = startCol; c <= endCol; c++) {
                if (grid[r] && grid[r][c]) sum += parseFloat(grid[r][c]) || 0;
              }
            }
            return sum;
          }
        }
        return eval(formula.toLowerCase());
      } catch (e) {
        return '#ERROR!';
      }
    }

                <button onclick="navigate('canva', 'templates')" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-nexus-600 border border-zinc-800 text-xs font-semibold transition">Templates</button>
                <button onclick="navigate('canva', 'presentation')" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-nexus-600 border border-zinc-800 text-xs font-semibold transition">Presentation</button>
                <button onclick="navigate('canva', 'social')" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-nexus-600 border border-zinc-800 text-xs font-semibold transition">Social Media</button>
                <button onclick="navigate('canva', 'video')" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-nexus-600 border border-zinc-800 text-xs font-semibold transition">Video</button>
                <button onclick="navigate('canva', 'doc')" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-nexus-600 border border-zinc-800 text-xs font-semibold transition">Doc</button>
                <button onclick="navigate('canva', 'whiteboard')" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-nexus-600 border border-zinc-800 text-xs font-semibold transition">Whiteboard</button>
                <button onclick="navigate('canva', 'spreadsheet')" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-nexus-600 border border-zinc-800 text-xs font-semibold transition">Spreadsheet</button>
                <button onclick="navigate('canva', 'code')" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-nexus-600 border border-zinc-800 text-xs font-semibold transition">Code</button>
              </div>
            </div>

            <!-- RECENT PROJECTS -->
            <div class="space-y-4">
              <h3 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="clock" class="w-5 h-5 text-nexus-500"></i> Recent Designs</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${state.projects.map(p => `
                  <div class="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 flex justify-between items-center group">
                    <div>
                      <div class="font-bold text-white text-sm">${p.name}</div>
                      <div class="text-[10px] text-zinc-500 uppercase font-mono mt-1">${p.type}</div>
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="openProject('${p.id}')" class="px-3 py-1.5 rounded-lg bg-nexus-600 text-xs font-semibold">Open</button>
                      <button onclick="deleteProject('${p.id}')" class="p-1.5 rounded-lg text-zinc-500 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- SEARCHED / FEATURED TEMPLATES -->
            <div class="space-y-4">
              <h3 class="text-xl font-bold text-white">Recommended Templates</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${filteredTemplates.map(t => `
                  <div class="p-5 rounded-2xl bg-zinc-900 border border-zinc-800 flex flex-col justify-between space-y-4">
                    <div>
                      <span class="text-[10px] bg-nexus-500/20 text-nexus-300 px-2 py-0.5 rounded-full font-mono">${t.category}</span>
                      <h4 class="font-bold text-white text-base mt-2">${t.name}</h4>
                    </div>
                    <button onclick="useTemplate('${t.id}')" class="w-full py-2 rounded-xl bg-zinc-800 hover:bg-nexus-600 text-xs font-semibold transition">Use Template</button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      // 2. PRESENTATION WORKSPACE
      if (state.designSubRoute === 'presentation') {
        const slide = state.presentationSlides[state.currentSlideIdx] || state.presentationSlides[0];
        return `
          <div class="flex h-full w-full">
            <!-- SLIDE THUMBNAILS -->
            <div class="w-48 border-r border-zinc-800 p-3 space-y-3 bg-zinc-900/40">
              <button onclick="addSlide()" class="w-full py-2 rounded-xl bg-nexus-600 text-xs font-bold flex items-center justify-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Slide</button>
              <div class="space-y-2 overflow-y-auto max-h-[calc(100vh-160px)]">
                ${state.presentationSlides.map((s, idx) => `
                  <div onclick="state.currentSlideIdx = ${idx}; render();" class="p-3 rounded-xl border ${state.currentSlideIdx === idx ? 'border-nexus-500 bg-zinc-800' : 'border-zinc-800'} cursor-pointer text-xs space-y-1">
                    <div class="font-bold text-zinc-300">Slide ${idx + 1}</div>
                    <div class="text-[10px] text-zinc-500 truncate">${s.text}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- MAIN CANVAS -->
            <div class="flex-1 flex flex-col justify-between p-6 bg-zinc-950 canvas-grid">
              <div class="flex justify-between items-center bg-zinc-900 p-3 rounded-2xl border border-zinc-800">
                <span class="text-sm font-bold">Presentation Editor</span>
                <div class="flex gap-2">
                  <button onclick="addSlide()" class="px-3 py-1.5 rounded-lg bg-zinc-800 text-xs">Duplicate</button>
                  <button onclick="deleteSlide()" class="px-3 py-1.5 rounded-lg bg-red-600/20 text-red-400 text-xs">Delete</button>
                  <button onclick="saveCurrentProject('presentation')" class="px-4 py-1.5 rounded-lg bg-nexus-600 text-xs font-bold">Save Deck</button>
                </div>
              </div>

              <div class="max-w-2xl w-full mx-auto h-80 rounded-2xl border border-zinc-800 flex items-center justify-center p-8 text-center shadow-2xl transition" style="background-color: ${slide.bg}">
                <textarea 
                  oninput="state.presentationSlides[state.currentSlideIdx].text = this.value; render();"
                  class="w-full bg-transparent text-center font-extrabold text-2xl text-white focus:outline-none resize-none"
                >${slide.text}</textarea>
              </div>

              <div class="text-center text-xs text-zinc-500">Edit content directly inside the presentation slide canvas.</div>
            </div>
          </div>
        `;
      }

      // 3. SPREADSHEET WORKSPACE
      if (state.designSubRoute === 'spreadsheet') {
        return `
          <div class="p-6 flex flex-col h-full space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="table" class="w-5 h-5 text-emerald-400"></i> Nexus Spreadsheets</h2>
              <button onclick="saveCurrentProject('spreadsheet')" class="px-4 py-2 rounded-xl bg-nexus-600 text-xs font-bold">Save Sheet</button>
            </div>

            <div class="flex-1 overflow-auto border border-zinc-800 rounded-2xl bg-zinc-900">
              <table class="w-full border-collapse text-xs">
                <thead>
                  <tr class="bg-zinc-800 text-zinc-400">
                    <th class="p-2 border border-zinc-700 w-12">#</th>
                    <th class="p-2 border border-zinc-700">A</th>
                    <th class="p-2 border border-zinc-700">B</th>
                    <th class="p-2 border border-zinc-700">C</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.spreadsheetData.map((row, rIdx) => `
                    <tr>
                      <td class="p-2 border border-zinc-800 bg-zinc-800/50 text-center text-zinc-500 font-bold">${rIdx + 1}</td>${row.map((cell, cIdx) => `
                        <td class="p-0 border border-zinc-800">
                          <input 
                            type="text" 
                            value="${cell}" 
                            onblur="state.spreadsheetData[${rIdx}][${cIdx}] = this.value; render();"
                            class="w-full p-2 bg-transparent focus:bg-zinc-800 focus:outline-none text-white"
                          />
                        </td>
                      `).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            <div class="text-xs text-zinc-500 font-mono">Supports formulas like =SUM(A1:B1), =SUM(A2:B2). Click off cell to evaluate.</div>
          </div>
        `;
      }

      // 4. WHITEBOARD WORKSPACE
      if (state.designSubRoute === 'whiteboard') {
        return `
          <div class="p-6 flex flex-col h-full space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="pen-tool" class="w-5 h-5 text-pink-400"></i> Interactive Whiteboard</h2>
              <button onclick="clearCanvas()" class="px-3 py-1.5 rounded-lg bg-zinc-800 text-xs">Clear Board</button>
            </div>
            <div class="flex-1 rounded-2xl border border-zinc-800 bg-zinc-900 relative overflow-hidden">
              <canvas id="whiteboardCanvas" class="w-full h-full cursor-crosshair"></canvas>
            </div>
          </div>
        `;
      }

      // 5. CODE WORKSPACE
      if (state.designSubRoute === 'code') {
        return `
          <div class="p-6 flex flex-col h-full space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="code" class="w-5 h-5 text-blue-400"></i> Live Code Workspace</h2>
              <button onclick="runCode()" class="px-4 py-2 rounded-xl bg-nexus-600 text-xs font-bold flex items-center gap-1"><i data-lucide="play" class="w-3.5 h-3.5"></i> Run Code</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
              <textarea id="codeEditor" class="w-full h-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 font-mono text-xs text-emerald-400 focus:outline-none resize-none">${state.codeSnippet}</textarea>
              <iframe id="codePreview" class="w-full h-full rounded-2xl bg-white border border-zinc-800"></iframe>
            </div>
          </div>
        `;
      }

      // 6. NEXUS AI DESIGNER PANEL
      if (state.designSubRoute === 'ai') {
        return `
          <div class="p-8 max-w-2xl mx-auto space-y-6">
            <h2 class="text-2xl font-bold text-white flex items-center gap-2"><i data-lucide="bot" class="w-6 h-6 text-nexus-500"></i> Nexus AI Designer Assistant</h2>
            <p class="text-xs text-zinc-400">Type a design goal (e.g. "Create a Grade 10 geography presentation about volcanicity").</p>
            
            <textarea 
              value="${state.aiDesignPrompt}"
              oninput="state.aiDesignPrompt = this.value;"
              placeholder="Describe what you want to design..." 
              class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 text-sm focus:outline-none focus:border-nexus-500 text-white h-32 resize-none"
            ></textarea>

            <button onclick="generateAIDesign()" class="w-full py-3 rounded-xl bg-nexus-600 text-sm font-bold">Generate Design Plan</button>

            ${state.aiDesignPlan ? `
              <div class="p-5 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-3">
                <h4 class="font-bold text-nexus-400 text-sm">Generated Design Plan</h4>
                <p class="text-xs text-zinc-300 whitespace-pre-wrap">${state.aiDesignPlan}</p>
                <button onclick="applyAIDesign()" class="px-4 py-2 rounded-xl bg-emerald-600 text-xs font-bold">Apply to Workspace</button>
              </div>
            ` : ''}
          </div>
        `;
      }

      // Fallback
      return `<div class="p-8 text-zinc-400">Workspace view initialized. Select a tool from the left menu.</div>`;
    }

    // =========================================================================
    // 3. AI CHAT VIEW ENGINE
    // =========================================================================
    function renderAIChatView() {
      const activeChat = state.chats.find(c => c.id === state.activeChatId) || state.chats[0];

      return `
        <div class="flex h-full w-full">
          <!-- CHAT RECENTS SIDEBAR -->
          <div class="w-60 border-r border-zinc-800 p-3 bg-zinc-900/30 flex flex-col justify-between">
            <div>
              <button onclick="createNewChatSession()" class="w-full py-2.5 px-3 rounded-xl border border-zinc-700 hover:bg-zinc-800 text-xs font-bold flex items-center gap-2 mb-4">
                <i data-lucide="plus" class="w-4 h-4"></i> New Chat
              </button>
              <div class="text-[10px] font-bold text-zinc-500 uppercase px-1 mb-2">Recents (${state.chats.length})</div>
              <div class="space-y-1 overflow-y-auto max-h-[calc(100vh-200px)]">
                ${state.chats.map(c => `
                  <div onclick="state.activeChatId = '${c.id}'; render();" class="p-2 rounded-lg cursor-pointer text-xs truncate ${state.activeChatId === c.id ? 'bg-zinc-800 text-white font-semibold' : 'text-zinc-400 hover:bg-zinc-800/50'}">
                    ${c.title}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- CHAT MESSAGES -->
          <div class="flex-1 flex flex-col justify-between p-6">
            <div class="flex-1 overflow-y-auto space-y-4 max-w-3xl mx-auto w-full">
              ${activeChat.messages.map(m => `
                <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
                  <div class="p-4 rounded-2xl max-w-lg text-sm ${m.sender === 'user' ? 'bg-nexus-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-zinc-200'}">
                    <p class="whitespace-pre-wrap">${m.text}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- CHAT INPUT -->
            <div class="max-w-3xl mx-auto w-full pt-4">
              <div class="flex items-center gap-2 p-2 rounded-2xl border border-zinc-800 bg-zinc-900">
                <input 
                  type="text" 
                  value="${state.inputText}"
                  oninput="state.inputText = this.value;"
                  onkeydown="if(event.key === 'Enter') sendChatMessage();"
                  placeholder="Ask Nexus AI anything..."
                  class="flex-1 bg-transparent border-none focus:outline-none text-sm text-white px-2"
                />
                <button onclick="sendChatMessage()" class="p-2 bg-white text-black rounded-xl"><i data-lucide="send" class="w-4 h-4"></i></button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // HELPER ACTIONS & EVENT HANDLERS
    // =========================================================================

    function login(provider) {
      state.user = { name: 'Nexus Student', email: 'user@nexus.ai', provider, avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Nexus' };
      DB.setUser(state.user);
      render();
    }

    function logout() {
      state.user = null;
      DB.setUser(null);
      render();
    }

    function createNewProject(type) {
      const p = {
        id: 'p_' + Date.now(),
        name: `New ${type.toUpperCase()} Design`,
        type,
        updatedAt: Date.now(),
        data: {}
      };
      state.projects.unshift(p);
      DB.setProjects(state.projects);
      navigate('canva', type, p);
    }

    function openProject(id) {
      const p = state.projects.find(proj => proj.id === id);
      if (p) navigate('canva', p.type, p);
    }

    function deleteProject(id) {
      state.projects = state.projects.filter(p => p.id !== id);
      DB.setProjects(state.projects);
      render();
    }

    function useTemplate(id) {
      const t = TEMPLATES.find(temp => temp.id === id);
      if (t) createNewProject(t.type);
    }

    function saveCurrentProject(type) {
      if (state.activeProject) {
        state.activeProject.updatedAt = Date.now();
        if (type === 'presentation') state.activeProject.data.slides = state.presentationSlides;
        if (type === 'spreadsheet') state.activeProject.data.grid = state.spreadsheetData;
        DB.setProjects(state.projects);
        alert("Project saved successfully to Nexus DB.");
      } else {
        createNewProject(type);
      }
    }

    async function sendChatMessage() {
      if (!state.inputText.trim()) return;
      const chat = state.chats.find(c => c.id === state.activeChatId);
      const text = state.inputText;
      state.inputText = '';
      chat.messages.push({ sender: 'user', text });
      render();

      const reply = await queryAI(text);
      chat.messages.push({ sender: 'ai', text: reply });
      DB.setChats(state.chats);
      render();
    }

    function createNewChatSession() {
      const newChat = { id: Date.now().toString(), title: 'New AI Chat', messages: [], updatedAt: Date.now() };
      state.chats.unshift(newChat);
      state.activeChatId = newChat.id;
      DB.setChats(state.chats);
      render();
    }

    function addSlide() {
      state.presentationSlides.push({ id: Date.now(), text: 'New Slide Title', bg: '#18181b' });
      state.currentSlideIdx = state.presentationSlides.length - 1;
      render();
    }

    function deleteSlide() {
      if (state.presentationSlides.length > 1) {
        state.presentationSlides.splice(state.currentSlideIdx, 1);
        state.currentSlideIdx = 0;
        render();
      }
    }

    async function generateAIDesign() {
      if (!state.aiDesignPrompt) return;
      state.aiDesignPlan = "Generating layout plan...";
      render();
      state.aiDesignPlan = await queryAI(`Generate a design outline for: ${state.aiDesignPrompt}. Provide titles and page breakdown.`);
      render();
    }

    function applyAIDesign() {
      state.presentationSlides = [
        { id: 1, text: state.aiDesignPrompt, bg: '#4c1d95' },
        { id: 2, text: 'Slide Outline generated by Nexus AI', bg: '#18181b' }
      ];
      navigate('canva', 'presentation');
    }

    function runCode() {
      const code = document.getElementById('codeEditor')?.value;
      const iframe = document.getElementById('codePreview');
      if (iframe && code) {
        iframe.srcdoc = `<script>${code}<\/script>`;
      }
    }

    function clearCanvas() {
      const canvas = document.getElementById('whiteboardCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function attachCanvasListeners() {
      const canvas = document.getElementById('whiteboardCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drawing = false;

      canvas.onmousedown = () => drawing = true;
      canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
      canvas.onmousemove = (e) => {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
      };
    }

    function renderSettingsModal() {
      return `
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div class="p-6 rounded-2xl max-w-md w-full border bg-zinc-900 border-zinc-800 text-white space-y-4">
            <h2 class="text-lg font-bold">Nexus Settings</h2>
            <div>
              <label class="text-xs font-semibold">Google Gemini API Key</label>
              <input 
                type="password" 
                value="${state.apiKey}"
                onchange="state.apiKey = this.value; DB.setApiKey(this.value);"
                placeholder="Paste API Key here"
                class="w-full p-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-xs text-white mt-1"
              />
            </div>
            <button onclick="state.isSettingsOpen = false; render();" class="w-full py-2 bg-nexus-600 text-white rounded-xl font-bold text-xs">Save & Close</button>
          </div>
        </div>
      `;
    }

    // Initial Launch
    render();
  </script>
</body>
</html>
